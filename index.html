<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d"); const S = Math.min(window.devicePixelRatio || 1, 3); c.width = 704 * S; c.height = 424 * S; ctx.scale(S, S);
const W = 640, H = 360, R = 10, RC = 23;
const cacapas = [
  { x: 2, y: 2 }, { x: W - 2, y: 2 },
  { x: W / 2, y: -6 }, { x: W / 2, y: H + 6 },
  { x: 2, y: H - 2 }, { x: W - 2, y: H - 2 },
];
const ordem = [1, 9, 2, 10, 8, 3, 4, 11, 5, 12, 13, 6, 14, 7, 15];
const cores = ["#f5c800","#1e40ff","#e02020","#6a1b9a","#ff7a00","#0a8a3a","#8b1a1a","#111111"];

let bolas, branca, grupo, vez, jogando, fim, msg, caiu, falta;
let mirando = false;
let posicionando = false;
let arrastando = false;
let dedo = { x: 0, y: 0 };

function novoJogo0() {
  bolas = [{ x: 160, y: 180, vx: 0, vy: 0, cor: "white" }];
  branca = bolas[0];
  let k = 0;
  for (let r = 0; r < 5; r++) {
    for (let i = 0; i <= r; i++) {
      const n = ordem[k++];
      bolas.push({
        x: 440 + r * 19,
        y: 180 + (i - r / 2) * 21,
        vx: 0, vy: 0,
        cor: cores[(n - 1) % 8],
        num: n,
        listrada: n > 8,
      });
    }
  }
  grupo = { 1: null, 2: null };
  vez = 1; jogando = false; fim = false;
  msg = ""; caiu = []; falta = false;
}
novoJogo();

function parado() {
  return bolas.every(b => Math.hypot(b.vx, b.vy) < 0.05);
}

function pos(e) {
  const r = c.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return {
    x: (t.clientX - r.left) * (704 / r.width) - M,
    y: (t.clientY - r.top) * (424 / r.height) - M,
  };
}

function comecar(e) {
  e.preventDefault();
  if (fim) { if (torneioAtivo) { torneioAtivo = false; mostrarTorneio(); } else novoJogo(); return; }
  if (jogando || !parado() || vez !== eu) return;
  dedo = pos(e);
  if (posicionando) { arrastando = true; mover(e); return; }
  mirando = true;
}
function mover(e) {
  e.preventDefault();
  if (arrastando) {
    const p = pos(e);
    branca.x = Math.max(R, Math.min(W - R, p.x));
    branca.y = Math.max(R, Math.min(H - R, p.y));
    if (online === 2) enviar({ t: 'mao', x: branca.x, y: branca.y, mv: 1 });
    return;
  }
  if (mirando) dedo = pos(e);
}
function soltar(e) {
  e.preventDefault();
  if (arrastando) {
    arrastando = false;
    if (online === 2) { enviar({ t: 'mao', x: branca.x, y: branca.y }); return; }
    if (!bolas.some(b => b !== branca && Math.hypot(b.x - branca.x, b.y - branca.y) < R * 2)) posicionando = false;
    return;
  }
  if (!mirando) return;
  mirando = false;
  const dx = branca.x - dedo.x;
  const dy = branca.y - dedo.y;
  const d = Math.hypot(dx, dy);
  if (d < 8) return;
  const forca = Math.min(d, 150) / 10;
  branca.vx = (dx / d) * forca;
  branca.vy = (dy / d) * forca;
  jogando = true; caiu = []; falta = false;
}
c.addEventListener("touchstart", comecar);
c.addEventListener("touchmove", mover);
c.addEventListener("touchend", soltar);
c.addEventListener("mousedown", comecar);
c.addEventListener("mousemove", mover);
c.addEventListener("mouseup", soltar);

function colidir(a, b) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const d = Math.hypot(dx, dy);
  if (d === 0 || d >= R * 2) return;
  const nx = dx / d, ny = dy / d;
  const sobra = R * 2 - d;
  a.x -= nx * sobra / 2; a.y -= ny * sobra / 2;
  b.x += nx * sobra / 2; b.y += ny * sobra / 2;
  const t = (a.vx * nx + a.vy * ny) - (b.vx * nx + b.vy * ny);
  a.vx -= t * nx; a.vy -= t * ny;
  b.vx += t * nx; b.vy += t * ny;
  somBatida(Math.abs(t));
  efeitoBatida(a, b);
}

function outro(v) { return v === 1 ? 2 : 1; }
function nomeGrupo(v) {
  if (!grupo[v]) return "";
  return grupo[v] === "lisa" ? " (lisas)" : " (listradas)";
}
function restantes(v) {
  const l = grupo[v] === "listrada";
  return bolas.filter(b => b.num && b.num !== 8 && b.listrada === l).length;
}

function fimDaJogada0() {
  jogando = false;
  if (caiu.some(b => b.num === 8)) {
    const ok = grupo[vez] && restantes(vez) === 0 && !falta;
    const gan = ok ? vez : outro(vez);
    fim = true;
    msg = "Jogador " + gan + " venceu!";
    return;
  }
  if (!grupo[vez] && caiu.length && !falta) {
    const g = caiu[0].listrada ? "listrada" : "lisa";
    grupo[vez] = g;
    grupo[outro(vez)] = g === "lisa" ? "listrada" : "lisa";
  }
  let meu = false;
  if (!falta && grupo[vez]) {
    meu = caiu.some(b => b.listrada === (grupo[vez] === "listrada"));
  }
  if (!meu) vez = outro(vez);
  if (falta) posicionando = true;
}

function checarCacapas() {
  for (let i = bolas.length - 1; i >= 0; i--) {
    const b = bolas[i];
    if (posicionando && b === branca) continue;
    if (cacapas.some(k => Math.hypot(b.x - k.x, b.y - k.y) < RC)) {
      if (b === branca) {
        b.x = 160; b.y = 180; b.vx = 0; b.vy = 0;
        falta = true; posicionando = true;
      } else {
        bolas.splice(i, 1);
        caiu.push(b);
        somCacapa();
        efeitoPonto(b.x, b.y, b.cor);
      }
    }
  }
}

const SUB = 4, FR = Math.pow(0.985, 1 / SUB);
function passo() {
  for (const b of bolas) {
    if (posicionando && b === branca) { b.vx = 0; b.vy = 0; }
    b.x += b.vx / SUB; b.y += b.vy / SUB;
    if (b.sx && b.livre) curva(b);
    b.vx *= FR; b.vy *= FR;
    if (Math.hypot(b.vx, b.vy) < 0.05) { b.vx = 0; b.vy = 0; }
    if (b.x < R) { b.x = R; b.vx *= -1; }
    if (b.x > W - R) { b.x = W - R; b.vx *= -1; }
    if (b.y < R) { b.y = R; b.vy *= -1; }
    if (b.y > H - R) { b.y = H - R; b.vy *= -1; }
  }
  for (let i = 0; i < bolas.length; i++)
    for (let j = i + 1; j < bolas.length; j++) {
      if (posicionando && (bolas[i] === branca || bolas[j] === branca)) continue;
      colidir(bolas[i], bolas[j]);
    }
  checarCacapas();
  if (jogando && !fim && parado()) fimDaJogada();
}

function desenharBola0(b) {
  ctx.beginPath();
  ctx.arc(b.x, b.y, R, 0, Math.PI * 2);
  ctx.fillStyle = b.listrada ? "white" : b.cor;
  ctx.fill();
  if (b.listrada) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(b.x, b.y, R, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = b.cor;
    ctx.fillRect(b.x - R, b.y - 5, R * 2, 10);
    ctx.restore();
  }
  if (b.num) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();
    ctx.fillStyle = "black";
    ctx.font = "6px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(b.num, b.x, b.y + 0.5);
  }
}

function desenhar00() {
  const _mt = mesaTema();
  if (!_mt) { ctx.fillStyle = mesaCor; ctx.fillRect(0, 0, W, H); }
  if (!_mt && mesaCor === "#0a7d37") {
    ctx.fillStyle = "#009c3b";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#ffdf00";
    ctx.beginPath();
    ctx.moveTo(W / 2, H * 0.1);
    ctx.lineTo(W * 0.9, H / 2);
    ctx.lineTo(W / 2, H * 0.9);
    ctx.lineTo(W * 0.1, H / 2);
    ctx.closePath();
    ctx.fill();
    const rr = H * 0.22;
    ctx.fillStyle = "#002776";
    ctx.beginPath();
    ctx.arc(W / 2, H / 2, rr, 0, Math.PI * 2);
    ctx.fill();
    ctx.save();
    ctx.beginPath();
    ctx.arc(W / 2, H / 2, rr, 0, Math.PI * 2);
    ctx.clip();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = rr * 0.2;
    ctx.beginPath();
    ctx.moveTo(W / 2 - rr, H / 2 + rr * 0.35);
    ctx.quadraticCurveTo(W / 2, H / 2 - rr * 0.5, W / 2 + rr, H / 2 - rr * 0.2);
    ctx.stroke();
    ctx.restore();
  }
  if (!_mt) {
  ctx.strokeStyle = "#5b3a1a";
  ctx.lineWidth = 8;
  ctx.strokeRect(0, 0, W, H);
  ctx.fillStyle = "black";
  for (const k of cacapas) {
    ctx.beginPath();
    ctx.arc(k.x, k.y, RC, 0, Math.PI * 2);
    ctx.fill();
  }
  }
  if (mirando) {
    const dx = branca.x - dedo.x;
    const dy = branca.y - dedo.y;
    const d = Math.hypot(dx, dy);
    if (d > 0) {
      const s = Math.min(d, 150) / d;
      ctx.beginPath();
      ctx.moveTo(branca.x, branca.y);
      ctx.lineTo(branca.x + dx * s, branca.y + dy * s);
      ctx.strokeStyle = d > 120 ? "rgba(255,90,90,0.9)" : "rgba(255,255,255,0.7)";
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.stroke();
      ctx.setLineDash([]);
      desenharTaco(dx, dy, d);
      desenharGuia(dx, dy);
    }
  }
  for (const b of bolas) desenharBola(b);

  ctx.fillStyle = "white";
  ctx.font = "16px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  ctx.fillText(treino ? "🎯 Tacadas: " + (MAXT - tacadas) + "   Pontos: " + pontos : "Vez: Jogador " + vez + (online && vez === eu ? " (você)" : "") + nomeGrupo(vez), W / 2, 12);
  if (posicionando) ctx.fillText("Bola na mão: arraste a branca", W / 2, 34);
  ctx.font = "14px sans-serif";
  ctx.textBaseline = "bottom";
  for (const j of []) {
    const f = grupo[j] ? 7 - restantes(j) : 0;
    ctx.fillText((online ? "J" + j : (j === 1 ? "Você" : "Bot")) + ": " + f + "/7",
                 j === 1 ? 160 : 480, H - 12);
  }
  ctx.textBaseline = "top";

  if (fim) {
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(170, 135, 300, 90);
    ctx.fillStyle = "white";
    ctx.font = "22px sans-serif";
    ctx.fillText(msg, 320, 153);
    ctx.font = "14px sans-serif";
    ctx.fillText("Toque pra jogar de novo", 320, 190);
  }
}


// ---- bot (Jogador 2) ----
let botEspera = 0;
function botJoga() {
  // bola na mão: coloca a branca num lugar livre
  if (posicionando) {
    branca.x = 160; branca.y = 180;
    posicionando = false;
    return;
  }
  // escolhe alvos do grupo dele (ou qualquer uma se ainda não tem grupo)
  let alvos = bolas.filter(b => b !== branca && b.num && b.num !== 8);
  if (grupo[2]) {
    const l = grupo[2] === "listrada";
    const meus = alvos.filter(b => b.listrada === l);
    alvos = meus.length ? meus : bolas.filter(b => b.num === 8);
  }
  if (!alvos.length) return;
  // pega a mais próxima da branca
  alvos.sort((a, b) =>
    Math.hypot(a.x - branca.x, a.y - branca.y) -
    Math.hypot(b.x - branca.x, b.y - branca.y));
  const alvo = alvos[0];
  // tenta mirar na bola e empurrar pra caçapa mais próxima dela
  let melhor = cacapas[0];
  for (const k of cacapas)
    if (Math.hypot(alvo.x - k.x, alvo.y - k.y) <
        Math.hypot(alvo.x - melhor.x, alvo.y - melhor.y)) melhor = k;
  const dx = alvo.x - melhor.x, dy = alvo.y - melhor.y;
  const dd = Math.hypot(dx, dy) || 1;
  const px = alvo.x + (dx / dd) * R * 2;
  const py = alvo.y + (dy / dd) * R * 2;
  let ax = px - branca.x, ay = py - branca.y;
  const d = Math.hypot(ax, ay) || 1;
  const erro = (Math.random() - 0.5) * dif;
  const ang = Math.atan2(ay, ax) + erro;
  const forca = 8 + Math.random() * 5;
  branca.vx = Math.cos(ang) * forca;
  branca.vy = Math.sin(ang) * forca;
  branca.sx = 0; branca.sy = 0; branca.livre = false;
  jogando = true; caiu = []; falta = false;
}

function botLoop() {
  if (online) return;
  if (vez === 2 && !jogando && !fim && parado()) {
    botEspera++;
    if (botEspera > 60) { botEspera = 0; botJoga(); }
  } else botEspera = 0;
}

let dif = 0.08;
let ac;
function bip(f, d, v) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "triangle";
    o.frequency.value = f;
    g.gain.setValueAtTime(v, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}
function somBatida(v) {
  if (v > 0.3) bip(300 + Math.random() * 100, 0.06, Math.min(0.4, v / 10));
}
function somCacapa() { bip(120, 0.25, 0.4); }

let taco = 0;
let mesaCor = "#0a7d37";
try { const _sm = localStorage.getItem("sinuca_mesa"); if (_sm) mesaCor = _sm; } catch (e) {}
const SKINS = [
  { a: "#d9a066", b: "#5b3a1a" },
  { a: "#39ff14", b: "#0a3d00" },
  { a: "#ffcc00", b: "#e02020" },
  { a: "#e0f7ff", b: "#1e6bff" },
  { a: "#fff3a0", b: "#b8860b" },
  { a: "#ffd1f0", b: "#e91e8c" },
  { a: "#c77dff", b: "#10002b" },
  { a: "#999999", b: "#111111" },
];
function desenharTaco0(dx, dy, d) {
  const sk = SKINS[taco];
  const m = Math.hypot(dx, dy) || 1;
  const ux = -dx / m, uy = -dy / m;
  const recuo = 14 + Math.min(d, 150) * 0.5;
  const x1 = branca.x + ux * recuo, y1 = branca.y + uy * recuo;
  const x2 = x1 + ux * 220, y2 = y1 + uy * 220;
  const g = ctx.createLinearGradient(x1, y1, x2, y2);
  g.addColorStop(0, sk.a);
  g.addColorStop(1, sk.b);
  ctx.save();
  ctx.setLineDash([]);
  ctx.lineCap = "round";
  ctx.strokeStyle = g;
  ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.strokeStyle = "#eee";
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x1, y1);
  ctx.lineTo(x1 + ux * 8, y1 + uy * 8); ctx.stroke();
  ctx.restore();
}

function sim(a, b) {
  return Math.random() < T.f[a] / (T.f[a] + T.f[b]) ? a : b;
}

function novoTorneio() {
  const ids = [];
  for (let i = 1; i < 32; i++) ids.push(i);
  ids.sort(() => Math.random() - 0.5);
  ids.unshift(0);
  T = {
    f: NOMES.map(() => 0.3 + Math.random() * 0.4),
    pts: NOMES.map(() => 0),
    grupos: [], rod: 0, fase: "grupos",
    lista: [], fim: false, final: "", opp: 0
  };
  for (let g = 0; g < 8; g++) T.grupos.push(ids.slice(g * 4, g * 4 + 4));
  proximaPartida();
}

function proximaPartida() {
  if (T.fase === "grupos") T.opp = T.grupos[0][T.rod + 1];
  else {
    const i = T.lista.indexOf(0);
    T.opp = T.lista[i % 2 === 0 ? i + 1 : i - 1];
  }
}

function nomeFase() {
  if (T.fase === "grupos") return "Fase de grupos - rodada " + (T.rod + 1) + "/3";
  return {16: "Oitavas de final", 8: "Quartas de final", 4: "Semifinal", 2: "Final"}[T.lista.length];
}

function premiarSamurai() {
  const i = CUES.findIndex(k => k.nome === "Samurai");
  if (i < 0) return "";
  if (!Array.isArray(save.donos)) save.donos = [0];
  if (save.donos.includes(i)) return "";
  save.donos.push(i);
  gravar();
  try { festa("Samurai"); } catch (e) {}
  return " Você ganhou o taco SAMURAI (edição limitada)!";
}
function resultado(ganhei) {
  const fa = nomeFase();
  if (T.fase === "grupos") {
    T.grupos.forEach((gr, g) => {
      FX[T.rod].forEach(([a, b]) => {
        const A = gr[a], B = gr[b];
        let w;
        if (g === 0 && (A === 0 || B === 0)) w = ganhei ? 0 : (A === 0 ? B : A);
        else w = sim(A, B);
        T.pts[w] += 3;
      });
    });
    T.rod++;
    if (T.rod === 3) {
      const q = T.grupos.map(gr => gr.slice().sort((x, y) => T.pts[y] - T.pts[x] || T.f[y] - T.f[x]));
      T.lista = [];
      for (let g = 0; g < 8; g += 2)
        T.lista.push(q[g][0], q[g + 1][1], q[g + 1][0], q[g][1]);
      T.fase = "mata";
      if (!T.lista.includes(0)) { T.fim = true; T.final = "Eliminado na fase de grupos"; }
    }
  } else {
    const prox = [];
    for (let i = 0; i < T.lista.length; i += 2) {
      const a = T.lista[i], b = T.lista[i + 1];
      let w;
      if (a === 0 || b === 0) w = ganhei ? 0 : (a === 0 ? b : a);
      else w = sim(a, b);
      prox.push(w);
    }
    const eraFinal = T.lista.length === 2;
    T.lista = prox;
    if (eraFinal) {
      T.fim = true;
      T.final = prox[0] === 0 ? "🏆 CAMPEÃO!" : "Vice-campeão! Perdeu a final.";
      if (prox[0] === 0) T.final += premiarSamurai();
    } else if (!prox.includes(0)) {
      T.fim = true;
      T.final = "Eliminado nas " + fa.toLowerCase();
    }
  }
  if (!T.fim) proximaPartida();
}

function mostrarTorneio() {
  let h = "<h2>🏆 Campeonato</h2>";
  if (T.fim) {
    h += "<h3>" + T.final + "</h3>";
    h += "<button onclick='novoTorneio();mostrarTorneio()'>Novo campeonato</button> ";
  } else {
    h += "<h3>" + nomeFase() + "</h3>";
    h += "<p>Você x " + NOMES[T.opp] + "</p>";
    h += "<button onclick='comecarPartida()'>Jogar</button> ";
  }
  h += "<button onclick='fecharPainel()'>Fechar</button>";
  if (T.fase === "grupos") {
    h += "<h4>Grupo A</h4>";
    T.grupos[0].slice().sort((x, y) => T.pts[y] - T.pts[x]).forEach(i => {
      h += "<div>" + NOMES[i] + " - " + T.pts[i] + " pts</div>";
    });
  } else {
    h += "<h4>Ainda no campeonato</h4>";
    h += "<div>" + T.lista.map(i => NOMES[i]).join(", ") + "</div>";
  }
  painel.innerHTML = h;
  painel.style.display = "block";
}

function desenharGuia0(dx, dy) {
  const m = Math.hypot(dx, dy);
  if (!m) return;
  const ux = dx / m, uy = dy / m;
  let t = 1e9, alvo = null;
  if (ux > 0) t = Math.min(t, (W - R - branca.x) / ux);
  if (ux < 0) t = Math.min(t, (R - branca.x) / ux);
  if (uy > 0) t = Math.min(t, (H - R - branca.y) / uy);
  if (uy < 0) t = Math.min(t, (R - branca.y) / uy);
  for (const b of bolas) {
    if (b === branca) continue;
    const fx = b.x - branca.x, fy = b.y - branca.y;
    const p = fx * ux + fy * uy;
    if (p <= 0) continue;
    const q = fx * fx + fy * fy - p * p;
    const r2 = 4 * R * R;
    if (q > r2) continue;
    const th = p - Math.sqrt(r2 - q);
    if (th > 0 && th < t) { t = th; alvo = b; }
  }
  const lim = 100 + stt()[1] * 6;
  if (t > lim) { t = lim; alvo = null; }
  const hx = branca.x + ux * t, hy = branca.y + uy * t;
  ctx.save();
  ctx.setLineDash([]);
  ctx.strokeStyle = "rgba(255,255,255,0.8)";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(branca.x, branca.y);
  ctx.lineTo(hx, hy);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(hx, hy, R, 0, Math.PI * 2);
  ctx.stroke();
  if (alvo) {
    const ax = alvo.x - hx, ay = alvo.y - hy;
    const am = Math.hypot(ax, ay) || 1;
    ctx.strokeStyle = "rgba(0,0,0,0.85)"; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(alvo.x, alvo.y); ctx.lineTo(alvo.x + (ax / am) * 60, alvo.y + (ay / am) * 60); ctx.stroke(); ctx.strokeStyle = "#00e5ff"; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(alvo.x, alvo.y);
    ctx.lineTo(alvo.x + (ax / am) * 60, alvo.y + (ay / am) * 60);
    ctx.stroke();
  }
  ctx.restore();
}

let ang = 0, potencia = 0.5, girando = false;
let ult = { x: 0, y: 0 }, tm = null;

function atualizarMira() {
  mirando = !jogando && !fim && !posicionando && vez === eu && parado();
  if (mirando) {
    const d = 20 + potencia * 130;
    dedo = { x: branca.x - Math.cos(ang) * d, y: branca.y - Math.sin(ang) * d };
  }
}

function bater() {
  if (!mirando) return;
  somTacada(typeof potencia === 'number' ? potencia : 1);
  if (online === 2) { enviar({ t: 'tacada', a: ang, p: potencia * fM(), sx: spinX * efM(), sy: spinY * efM() }); return; }
  const f = potencia * 15 * fM();
  branca.vx = Math.cos(ang) * f;
  branca.vy = Math.sin(ang) * f;
  branca.sx = spinX * efM(); branca.sy = spinY * efM();
  branca.ex = Math.cos(ang); branca.ey = Math.sin(ang); branca.livre = true;
  jogando = true; caiu = []; falta = false;
}

function segurar(dir) {
  parar();
  tm = setInterval(() => { ang += dir * 0.003; }, 30);
}
function parar() { clearInterval(tm); }

function comecar(e) {
  e.preventDefault();
  if (fim) {
    if (torneioAtivo) { torneioAtivo = false; mostrarTorneio(); }
    else novoJogo();
    return;
  }
  if (jogando || vez !== eu) return;
  if (!posicionando && !parado()) return;
  ult = pos(e);
  if (posicionando) { arrastando = true; mover(e); return; }
  girando = true;
}

function mover(e) {
  e.preventDefault();
  const p = pos(e);
  if (arrastando) {
    branca.x = Math.max(R, Math.min(W - R, p.x));
    branca.y = Math.max(R, Math.min(H - R, p.y));
    if (online === 2) enviar({ t: 'mao', x: branca.x, y: branca.y, mv: 1 });
    return;
  }
  if (girando) {
    ang += (p.y - ult.y) * 0.004;
    ult = p;
  }
}

function soltar(e) {
  e.preventDefault();
  if (arrastando) {
    arrastando = false;
    if (online === 2) { window.segura = Date.now() + 1000; const fx = branca.x, fy = branca.y; enviar({ t: 'mao', x: fx, y: fy }); setTimeout(() => enviar({ t: 'mao', x: fx, y: fy }), 200); return; }
    if (!bolas.some(b => b !== branca && Math.hypot(b.x - branca.x, b.y - branca.y) < R * 2)) posicionando = false;
    return;
  }
  girando = false;
}

function _rng(s) { return function () { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function _rachadura(g, r, x, y, ang, len, prof) {
  g.beginPath(); g.moveTo(x, y);
  let px = x, py = y;
  const n = Math.max(3, Math.floor(len / 9));
  for (let i = 0; i < n; i++) {
    ang += (r() - 0.5) * 0.9;
    px += Math.cos(ang) * len / n; py += Math.sin(ang) * len / n;
    g.lineTo(px, py);
    if (prof > 0 && r() < 0.28) {
      const gx = px, gy = py;
      g.stroke();
      _rachadura(g, r, gx, gy, ang + (r() < 0.5 ? 1 : -1) * (0.5 + r() * 0.6), len * 0.45, prof - 1);
      g.beginPath(); g.moveTo(px, py);
    }
  }
  g.stroke();
}

function aplicarEstado(m) {
  if (online !== 2) return;
  const px = branca.x, py = branca.y;
  const ant = bolas;
  bolas = m.b.map(a => ({
    x: a[0], y: a[1], vx: a[2], vy: a[3],

    cor: a[4] ? cores[(a[4] - 1) % 8] : "white",
    listrada: a[4] > 8,
  }));
  branca = bolas.find(b => !b.num);
  for (const a of ant) if (a.num && !bolas.some(n => n.num === a.num)) efeitoPonto(a.x, a.y, a.cor);
  if (arrastando || Date.now() < (window.segura || 0)) { branca.x = px; branca.y = py; }

function aplicarTacada(m) {

  const f = m.p * 15;

  branca.vy = Math.sin(m.a) * f;
  branca.sx = m.sx; branca.sy = m.sy;
  branca.ex = Math.cos(m.a); branca.ey = Math.sin(m.a); branca.livre = true;

function aplicarMao(m) {
  if (vez !== 2 || !posicionando) return;
  branca.x = Math.max(R, Math.min(W - R, m.x));
  branca.y = Math.max(R, Math.min(H - R, m.y));
  if (m.mv) return;
  if (!bolas.some(b => b !== branca && Math.hypot(b.x - branca.x, b.y - branca.y) < R * 2)) posicionando = false;
}

}

var SB = {};
function carregarSons() {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  ["batida", "cacapa", "tacada"].forEach(function (n) {
    fetch(n + ".mp3").then(function (r) { return r.arrayBuffer(); })
      .then(function (d) { return new Promise(function (ok, no) { ac.decodeAudioData(d, ok, no); }); })
      .then(function (b) { SB[n] = b; }).catch(function () {});
  });
}
function tocar(n, vol, rate) {
  if (!SB[n] || !ac) return false;
  if (ac.state === "suspended") ac.resume();
  var s = ac.createBufferSource(), g = ac.createGain();
  s.buffer = SB[n]; s.playbackRate.value = rate || 1; g.gain.value = vol;
  s.connect(g); g.connect(ac.destination); s.start();
  return true;
}
var sb0 = somBatida, sc0 = somCacapa;
somBatida = function (v) {
  if (v <= 0.3) return;
  var vol = Math.min(1, 0.15 + v / 12 * 0.85);
  if (!tocar("batida", vol, 0.95 + Math.random() * 0.1)) sb0(v);
};
somCacapa = function () { if (!tocar("cacapa", 1, 1)) sc0(); };
function somTacada(p) { tocar("tacada", Math.min(1, 0.4 + 0.6 * p), 1); }
carregarSons();


function somTabela(v) {
  var n = performance.now();
  if (n - (somTabela.u || 0) < 50) return;
  somTabela.u = n;
  if (!ac) return;
  if (ac.state === "suspended") ac.resume();
  var vol = 0.12 + 0.6 * Math.min(1, v / 12);
  var t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(170, t);
  o.frequency.exponentialRampToValueAtTime(70, t + 0.12);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + 0.16);
  tocar("batida", vol * 0.55, 0.5);
}
if (typeof passo === "function") {
  var passo0 = passo;

    var arr = bolas.slice();

      var fx = p[0] * b.vx < 0 && Math.abs(p[0]) > 0.5;
      var fy = p[1] * b.vy < 0 && Math.abs(p[1]) > 0.5;
      if (fx || fy) m = Math.max(m, Math.hypot(p[0], p[1]));
    });
    if (m > 0) somTabela(m);
  };
}
