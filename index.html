<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");
const W = 640, H = 360, R = 10, RC = 26;
const cacapas = [
  { x: 0, y: 0 }, { x: W, y: 0 },
  { x: W / 2, y: 0 }, { x: W / 2, y: H },
  { x: 0, y: H }, { x: W, y: H },
];
const ordem = [1, 9, 2, 10, 8, 3, 4, 11, 5, 12, 13, 6, 14, 7, 15];
const cores = ["#f5c800","#1e40ff","#e02020","#6a1b9a","#ff7a00","#0a8a3a","#8b1a1a","#111111"];

let bolas, branca, grupo, vez, jogando, fim, msg, caiu, falta;
let mirando = false;
let posicionando = false;
let arrastando = false;
let dedo = { x: 0, y: 0 };

function novoJogo0() {
  bolas = [{ x: 160, y: 180, vx: 0, vy: 0, cor: "white" }];
  branca = bolas[0];
  let k = 0;
  for (let r = 0; r < 5; r++) {
    for (let i = 0; i <= r; i++) {
      const n = ordem[k++];
      bolas.push({
        x: 440 + r * 19,
        y: 180 + (i - r / 2) * 21,
        vx: 0, vy: 0,
        cor: cores[(n - 1) % 8],
        num: n,
        listrada: n > 8,
      });
    }
  }
  grupo = { 1: null, 2: null };
  vez = 1; jogando = false; fim = false;
  msg = ""; caiu = []; falta = false;
}
novoJogo();

function parado() {
  return bolas.every(b => Math.hypot(b.vx, b.vy) < 0.05);
}

function pos(e) {
  const r = c.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return {
    x: (t.clientX - r.left) * (c.width / r.width) - M,
    y: (t.clientY - r.top) * (c.height / r.height) - M,
  };
}

function comecar(e) {
  e.preventDefault();
  if (fim) { if (torneioAtivo) { torneioAtivo = false; mostrarTorneio(); } else novoJogo(); return; }
  if (jogando || !parado() || vez !== eu) return;
  dedo = pos(e);
  if (posicionando) { arrastando = true; mover(e); return; }
  mirando = true;
}
function mover(e) {
  e.preventDefault();
  if (arrastando) {
    const p = pos(e);
    branca.x = Math.max(R, Math.min(W - R, p.x));
    branca.y = Math.max(R, Math.min(H - R, p.y));
    return;
  }
  if (mirando) dedo = pos(e);
}
function soltar(e) {
  e.preventDefault();
  if (arrastando) {
    arrastando = false;
    if (online === 2) { enviar({ t: 'mao', x: branca.x, y: branca.y }); return; }
    if (!bolas.some(b => b !== branca && Math.hypot(b.x - branca.x, b.y - branca.y) < R * 2)) posicionando = false;
    return;
  }
  if (!mirando) return;
  mirando = false;
  const dx = branca.x - dedo.x;
  const dy = branca.y - dedo.y;
  const d = Math.hypot(dx, dy);
  if (d < 8) return;
  const forca = Math.min(d, 150) / 10;
  branca.vx = (dx / d) * forca;
  branca.vy = (dy / d) * forca;
  jogando = true; caiu = []; falta = false;
}
c.addEventListener("touchstart", comecar);
c.addEventListener("touchmove", mover);
c.addEventListener("touchend", soltar);
c.addEventListener("mousedown", comecar);
c.addEventListener("mousemove", mover);
c.addEventListener("mouseup", soltar);

function colidir(a, b) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const d = Math.hypot(dx, dy);
  if (d === 0 || d >= R * 2) return;
  const nx = dx / d, ny = dy / d;
  const sobra = R * 2 - d;
  a.x -= nx * sobra / 2; a.y -= ny * sobra / 2;
  b.x += nx * sobra / 2; b.y += ny * sobra / 2;
  const t = (a.vx * nx + a.vy * ny) - (b.vx * nx + b.vy * ny);
  a.vx -= t * nx; a.vy -= t * ny;
  b.vx += t * nx; b.vy += t * ny;
  somBatida(Math.abs(t));
  efeitoBatida(a, b);
}

function outro(v) { return v === 1 ? 2 : 1; }
function nomeGrupo(v) {
  if (!grupo[v]) return "";
  return grupo[v] === "lisa" ? " (lisas)" : " (listradas)";
}
function restantes(v) {
  const l = grupo[v] === "listrada";
  return bolas.filter(b => b.num && b.num !== 8 && b.listrada === l).length;
}

function fimDaJogada0() {
  jogando = false;
  if (caiu.some(b => b.num === 8)) {
    const ok = grupo[vez] && restantes(vez) === 0 && !falta;
    const gan = ok ? vez : outro(vez);
    fim = true;
    msg = "Jogador " + gan + " venceu!";
    return;
  }
  if (!grupo[vez] && caiu.length && !falta) {
    const g = caiu[0].listrada ? "listrada" : "lisa";
    grupo[vez] = g;
    grupo[outro(vez)] = g === "lisa" ? "listrada" : "lisa";
  }
  let meu = false;
  if (!falta && grupo[vez]) {
    meu = caiu.some(b => b.listrada === (grupo[vez] === "listrada"));
  }
  if (!meu) vez = outro(vez);
  if (falta) posicionando = true;
}

function checarCacapas() {
  for (let i = bolas.length - 1; i >= 0; i--) {
    const b = bolas[i];
    if (cacapas.some(k => Math.hypot(b.x - k.x, b.y - k.y) < RC)) {
      if (b === branca) {
        b.x = 160; b.y = 180; b.vx = 0; b.vy = 0;
        falta = true; posicionando = true;
      } else {
        bolas.splice(i, 1);
        caiu.push(b);
        somCacapa();
      }
    }
  }
}

const SUB = 4, FR = Math.pow(0.985, 1 / SUB);
function passo() {
  for (const b of bolas) {
    b.x += b.vx / SUB; b.y += b.vy / SUB;
    if (b.sx && b.livre) curva(b);
    b.vx *= FR; b.vy *= FR;
    if (Math.hypot(b.vx, b.vy) < 0.05) { b.vx = 0; b.vy = 0; }
    if (b.x < R) { b.x = R; b.vx *= -1; }
    if (b.x > W - R) { b.x = W - R; b.vx *= -1; }
    if (b.y < R) { b.y = R; b.vy *= -1; }
    if (b.y > H - R) { b.y = H - R; b.vy *= -1; }
  }
  for (let i = 0; i < bolas.length; i++)
    for (let j = i + 1; j < bolas.length; j++)
      colidir(bolas[i], bolas[j]);
  checarCacapas();
  if (jogando && !fim && parado()) fimDaJogada();
}

function desenharBola0(b) {
  ctx.beginPath();
  ctx.arc(b.x, b.y, R, 0, Math.PI * 2);
  ctx.fillStyle = b.listrada ? "white" : b.cor;
  ctx.fill();
  if (b.listrada) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(b.x, b.y, R, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = b.cor;
    ctx.fillRect(b.x - R, b.y - 5, R * 2, 10);
    ctx.restore();
  }
  if (b.num) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();
    ctx.fillStyle = "black";
    ctx.font = "6px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(b.num, b.x, b.y + 0.5);
  }
}

function desenhar0() {
  ctx.fillStyle = mesaCor;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "#5b3a1a";
  ctx.lineWidth = 8;
  ctx.strokeRect(0, 0, W, H);
  ctx.fillStyle = "black";
  for (const k of cacapas) {
    ctx.beginPath();
    ctx.arc(k.x, k.y, RC, 0, Math.PI * 2);
    ctx.fill();
  }
  if (mirando) {
    const dx = branca.x - dedo.x;
    const dy = branca.y - dedo.y;
    const d = Math.hypot(dx, dy);
    if (d > 0) {
      const s = Math.min(d, 150) / d;
      ctx.beginPath();
      ctx.moveTo(branca.x, branca.y);
      ctx.lineTo(branca.x + dx * s, branca.y + dy * s);
      ctx.strokeStyle = d > 120 ? "rgba(255,90,90,0.9)" : "rgba(255,255,255,0.7)";
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.stroke();
      ctx.setLineDash([]);
      desenharTaco(dx, dy, d);
      desenharGuia(dx, dy);
    }
  }
  for (const b of bolas) desenharBola(b);

  ctx.fillStyle = "white";
  ctx.font = "16px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  ctx.fillText(treino ? "🎯 Tacadas: " + (MAXT - tacadas) + "   Pontos: " + pontos : "Vez: Jogador " + vez + (online && vez === eu ? " (você)" : "") + nomeGrupo(vez), W / 2, 12);
  if (posicionando) ctx.fillText("Bola na mão: arraste a branca", W / 2, 34);
  ctx.font = "14px sans-serif";
  ctx.textBaseline = "bottom";
  for (const j of (treino ? [] : [1, 2])) {
    const f = grupo[j] ? 7 - restantes(j) : 0;
    ctx.fillText((online ? "J" + j : (j === 1 ? "Você" : "Bot")) + ": " + f + "/7",
                 j === 1 ? 160 : 480, H - 12);
  }
  ctx.textBaseline = "top";

  if (fim) {
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(170, 135, 300, 90);
    ctx.fillStyle = "white";
    ctx.font = "22px sans-serif";
    ctx.fillText(msg, 320, 153);
    ctx.font = "14px sans-serif";
    ctx.fillText("Toque pra jogar de novo", 320, 190);
  }
}


// ---- bot (Jogador 2) ----
let botEspera = 0;
function botJoga() {
  // bola na mão: coloca a branca num lugar livre
  if (posicionando) {
    branca.x = 160; branca.y = 180;
    posicionando = false;
    return;
  }
  // escolhe alvos do grupo dele (ou qualquer uma se ainda não tem grupo)
  let alvos = bolas.filter(b => b !== branca && b.num && b.num !== 8);
  if (grupo[2]) {
    const l = grupo[2] === "listrada";
    const meus = alvos.filter(b => b.listrada === l);
    alvos = meus.length ? meus : bolas.filter(b => b.num === 8);
  }
  if (!alvos.length) return;
  // pega a mais próxima da branca
  alvos.sort((a, b) =>
    Math.hypot(a.x - branca.x, a.y - branca.y) -
    Math.hypot(b.x - branca.x, b.y - branca.y));
  const alvo = alvos[0];
  // tenta mirar na bola e empurrar pra caçapa mais próxima dela
  let melhor = cacapas[0];
  for (const k of cacapas)
    if (Math.hypot(alvo.x - k.x, alvo.y - k.y) <
        Math.hypot(alvo.x - melhor.x, alvo.y - melhor.y)) melhor = k;
  const dx = alvo.x - melhor.x, dy = alvo.y - melhor.y;
  const dd = Math.hypot(dx, dy) || 1;
  const px = alvo.x + (dx / dd) * R * 2;
  const py = alvo.y + (dy / dd) * R * 2;
  let ax = px - branca.x, ay = py - branca.y;
  const d = Math.hypot(ax, ay) || 1;
  const erro = (Math.random() - 0.5) * dif;
  const ang = Math.atan2(ay, ax) + erro;
  const forca = 8 + Math.random() * 5;
  branca.vx = Math.cos(ang) * forca;
  branca.vy = Math.sin(ang) * forca;
  branca.sx = 0; branca.sy = 0; branca.livre = false;
  jogando = true; caiu = []; falta = false;
}

function botLoop() {
  if (online) return;
  if (vez === 2 && !jogando && !fim && parado()) {
    botEspera++;
    if (botEspera > 60) { botEspera = 0; botJoga(); }
  } else botEspera = 0;
}

let dif = 0.08;
let ac;
function bip(f, d, v) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "triangle";
    o.frequency.value = f;
    g.gain.setValueAtTime(v, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}
function somBatida(v) {
  if (v > 0.3) bip(300 + Math.random() * 100, 0.06, Math.min(0.4, v / 10));
}
function somCacapa() { bip(120, 0.25, 0.4); }

let taco = 0;
let mesaCor = "#0a6b2e";
const SKINS = [
  { a: "#d9a066", b: "#5b3a1a" },
  { a: "#39ff14", b: "#0a3d00" },
  { a: "#ffcc00", b: "#e02020" },
  { a: "#e0f7ff", b: "#1e6bff" },
  { a: "#fff3a0", b: "#b8860b" },
  { a: "#ffd1f0", b: "#e91e8c" },
  { a: "#c77dff", b: "#10002b" },
  { a: "#999999", b: "#111111" },
];
function desenharTaco0(dx, dy, d) {
  const sk = SKINS[taco];
  const m = Math.hypot(dx, dy) || 1;
  const ux = -dx / m, uy = -dy / m;
  const recuo = 14 + Math.min(d, 150) * 0.5;
  const x1 = branca.x + ux * recuo, y1 = branca.y + uy * recuo;
  const x2 = x1 + ux * 220, y2 = y1 + uy * 220;
  const g = ctx.createLinearGradient(x1, y1, x2, y2);
  g.addColorStop(0, sk.a);
  g.addColorStop(1, sk.b);
  ctx.save();
  ctx.setLineDash([]);
  ctx.lineCap = "round";
  ctx.strokeStyle = g;
  ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.strokeStyle = "#eee";
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x1, y1);
  ctx.lineTo(x1 + ux * 8, y1 + uy * 8); ctx.stroke();
  ctx.restore();
}

// ---- campeonato ----
const NOMES = ["Você","Ana","Bruno","Carla","Diego","Elisa","Fábio","Gabi","Hugo","Iara","João","Karen","Lucas","Marta","Nando","Olga","Paulo","Quica","Rafa","Sara","Tito","Úrsula","Vitor","Wanda","Xavier","Yara","Zeca","Bia","Caio","Duda","Enzo","Fran"];
const FX = [[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
let T = null, torneioAtivo = false, reportado = false;

const painel = document.createElement("div");
painel.style.cssText = "position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,10,10,0.96);color:#fff;font-family:sans-serif;text-align:center;padding:20px;overflow:auto;display:none;z-index:9";
document.body.appendChild(painel);

function sim(a, b) {
  return Math.random() < T.f[a] / (T.f[a] + T.f[b]) ? a : b;
}

function novoTorneio() {
  const ids = [];
  for (let i = 1; i < 32; i++) ids.push(i);
  ids.sort(() => Math.random() - 0.5);
  ids.unshift(0);
  T = {
    f: NOMES.map(() => 0.3 + Math.random() * 0.4),
    pts: NOMES.map(() => 0),
    grupos: [], rod: 0, fase: "grupos",
    lista: [], fim: false, final: "", opp: 0
  };
  for (let g = 0; g < 8; g++) T.grupos.push(ids.slice(g * 4, g * 4 + 4));
  proximaPartida();
}

function proximaPartida() {
  if (T.fase === "grupos") T.opp = T.grupos[0][T.rod + 1];
  else {
    const i = T.lista.indexOf(0);
    T.opp = T.lista[i % 2 === 0 ? i + 1 : i - 1];
  }
}

function nomeFase() {
  if (T.fase === "grupos") return "Fase de grupos - rodada " + (T.rod + 1) + "/3";
  return {16: "Oitavas de final", 8: "Quartas de final", 4: "Semifinal", 2: "Final"}[T.lista.length];
}

function resultado(ganhei) {
  const fa = nomeFase();
  if (T.fase === "grupos") {
    T.grupos.forEach((gr, g) => {
      FX[T.rod].forEach(([a, b]) => {
        const A = gr[a], B = gr[b];
        let w;
        if (g === 0 && (A === 0 || B === 0)) w = ganhei ? 0 : (A === 0 ? B : A);
        else w = sim(A, B);
        T.pts[w] += 3;
      });
    });
    T.rod++;
    if (T.rod === 3) {
      const q = T.grupos.map(gr => gr.slice().sort((x, y) => T.pts[y] - T.pts[x] || T.f[y] - T.f[x]));
      T.lista = [];
      for (let g = 0; g < 8; g += 2)
        T.lista.push(q[g][0], q[g + 1][1], q[g + 1][0], q[g][1]);
      T.fase = "mata";
      if (!T.lista.includes(0)) { T.fim = true; T.final = "Eliminado na fase de grupos"; }
    }
  } else {
    const prox = [];
    for (let i = 0; i < T.lista.length; i += 2) {
      const a = T.lista[i], b = T.lista[i + 1];
      let w;
      if (a === 0 || b === 0) w = ganhei ? 0 : (a === 0 ? b : a);
      else w = sim(a, b);
      prox.push(w);
    }
    const eraFinal = T.lista.length === 2;
    T.lista = prox;
    if (eraFinal) {
      T.fim = true;
      T.final = prox[0] === 0 ? "🏆 CAMPEÃO!" : "Vice-campeão! Perdeu a final.";
    } else if (!prox.includes(0)) {
      T.fim = true;
      T.final = "Eliminado nas " + fa.toLowerCase();
    }
  }
  if (!T.fim) proximaPartida();
}

function mostrarTorneio() {
  let h = "<h2>🏆 Campeonato</h2>";
  if (T.fim) {
    h += "<h3>" + T.final + "</h3>";
    h += "<button onclick='novoTorneio();mostrarTorneio()'>Novo campeonato</button> ";
  } else {
    h += "<h3>" + nomeFase() + "</h3>";
    h += "<p>Você x " + NOMES[T.opp] + "</p>";
    h += "<button onclick='comecarPartida()'>Jogar</button> ";
  }
  h += "<button onclick='fecharPainel()'>Fechar</button>";
  if (T.fase === "grupos") {
    h += "<h4>Grupo A</h4>";
    T.grupos[0].slice().sort((x, y) => T.pts[y] - T.pts[x]).forEach(i => {
      h += "<div>" + NOMES[i] + " - " + T.pts[i] + " pts</div>";
    });
  } else {
    h += "<h4>Ainda no campeonato</h4>";
    h += "<div>" + T.lista.map(i => NOMES[i]).join(", ") + "</div>";
  }

function desenharGuia(dx, dy) {
  const m = Math.hypot(dx, dy);
  if (!m) return;
  const ux = dx / m, uy = dy / m;
  let t = 1e9, alvo = null;
  if (ux > 0) t = Math.min(t, (W - R - branca.x) / ux);
  if (ux < 0) t = Math.min(t, (R - branca.x) / ux);
  if (uy > 0) t = Math.min(t, (H - R - branca.y) / uy);
  if (uy < 0) t = Math.min(t, (R - branca.y) / uy);
  for (const b of bolas) {
    if (b === branca) continue;
    const fx = b.x - branca.x, fy = b.y - branca.y;
    const p = fx * ux + fy * uy;
    if (p <= 0) continue;
    const q = fx * fx + fy * fy - p * p;
    const r2 = 4 * R * R;
    if (q > r2) continue;
    const th = p - Math.sqrt(r2 - q);
    if (th > 0 && th < t) { t = th; alvo = b; }
  }
  const lim = 100 + stt()[1] * 6;
  if (t > lim) { t = lim; alvo = null; }
  const hx = branca.x + ux * t, hy = branca.y + uy * t;
  ctx.save();
  ctx.setLineDash([]);
  ctx.strokeStyle = "rgba(255,255,255,0.8)";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(branca.x, branca.y);
  ctx.lineTo(hx, hy);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(hx, hy, R, 0, Math.PI * 2);
  ctx.stroke();
  if (alvo) {
    const ax = alvo.x - hx, ay = alvo.y - hy;
    const am = Math.hypot(ax, ay) || 1;
    ctx.strokeStyle = "rgba(255,220,80,0.9)";
    ctx.beginPath();
    ctx.moveTo(alvo.x, alvo.y);
    ctx.lineTo(alvo.x + (ax / am) * 60, alvo.y + (ay / am) * 60);
    ctx.stroke();
  }
  ctx.restore();
}

}

function aplicarEstado(m) {
  if (online !== 2) return;
  const px = branca.x, py = branca.y;
  bolas = m.b.map(a => ({

  branca = bolas.find(b => !b.num);
  if (arrastando) { branca.x = px; branca.y = py; }
  vez = m.v; jogando = m.j; fim = m.f; msg = m.m;

function aplicarTacada(m) {
  if (vez !== 2 || jogando || fim || !parado() || posicionando) return;

function perfil() {
  const xp = save.xp || 0, n = nivel(xp);
  const a = xpDe(n), b = xpDe(n + 1);
  const r = rank(n), p = Math.round((xp - a) / (b - a) * 100);
  return "<div style='font-size:15px'>" + r[0] + " " + r[1] + " · Nível " + n + "</div>" +
    "<div style='width:200px;height:8px;background:#333;border-radius:4px;margin:3px auto'><div style='width:" + p + "%;height:8px;background:#f5c800;border-radius:4px'></div></div>" +
    "<div style='font-size:12px;opacity:.8'>" + xp + " / " + b + " XP</div>";
}

function abrirMenu() {
  treino = false;
  mp.style.justifyContent = "safe center";
  mp.innerHTML = EST + "<style>.mb{width:230px;font-size:16px;padding:9px 0}</style>" +
    "<div>🪙 " + save.moedas + "</div>" + perfil() +
    "<div style='display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px'>" +
    B("jogarBot()", "🎮 Jogar") + B("menuOnline()", "🌐 Jogar online") +
    B("irCamp()", "🏆 Campeonato") + B("irLoja()", "🛒 Loja de tacos") +
    B("irRoleta()", "🎁 Roleta diária") + B("irTreino()", "🎯 Treino") +
    B("opcoes()", "⚙ Opções", "s") + "</div>";
  mp.style.display = "flex";
}

function ganhaTaco() {
  const l = [1, 2, 3, 4].filter(i => !save.donos.includes(i));
  if (!l.length) { save.moedas += 300; return "🪙 300"; }
  const i = l[Math.floor(Math.random() * l.length)];
  save.donos.push(i);
  return "Taco " + CUES[i].nome + "!";
}
var PR = [
  { n: "🪙50", p: 25, f: () => { save.moedas += 50; } },
  { n: "🪙100", p: 20, f: () => { save.moedas += 100; } },
  { n: "⭐60 XP", p: 15, f: () => { ganharXP(60); } },
  { n: "🪙75", p: 15, f: () => { save.moedas += 75; } },
  { n: "🪙200", p: 8, f: () => { save.moedas += 200; } },
  { n: "⭐120 XP", p: 8, f: () => { ganharXP(120); } },
  { n: "🪙150", p: 6, f: () => { save.moedas += 150; } },
  { n: "🎁 Taco", p: 3, f: ganhaTaco },
];
function sorteio() {
  let t = 0;
  PR.forEach(x => t += x.p);
  let r = Math.random() * t;
  for (let i = 0; i < PR.length; i++) { r -= PR[i].p; if (r < 0) return i; }
  return 0;
}

const rol = document.createElement("div");
rol.style.cssText = "position:fixed;inset:0;background:#10151c;color:#fff;font-family:sans-serif;display:none;z-index:22;align-items:center;justify-content:center;gap:30px;text-align:center";
document.body.appendChild(rol);

function irRoleta() { mp.style.display = "none"; tela(); abrirRoleta(); }
function fecharRoleta() { rol.style.display = "none"; abrirMenu(); }

function abrirRoleta() {
  const pode = save.dia !== new Date().toDateString();
  const cs = ["#e02020","#f5c800","#1e40ff","#0a8a3a","#ff7a00","#6a1b9a","#e91e8c","#00b7c2"];
  const cg = cs.map((c, i) => c + " " + i * 45 + "deg " + (i + 1) * 45 + "deg").join(",");
  const lb = PR.map((p, i) => "<div style='position:absolute;left:50%;top:50%;white-space:nowrap;font-size:13px;font-weight:bold;text-shadow:0 0 3px #000;transform:rotate(" + (i * 45 + 22.5) + "deg) translateY(-78px) translateX(-50%)'>" + p.n + "</div>").join("");
  rol.innerHTML =
    "<div style='position:relative;width:200px;height:200px'>" +
    "<div id='rd' style='position:absolute;inset:0;border-radius:50%;border:4px solid #fff;box-sizing:border-box;background:conic-gradient(" + cg + ");transition:transform 4s cubic-bezier(.1,.7,.1,1)'>" + lb + "</div>" +
    "<div style='position:absolute;left:50%;top:-18px;transform:translateX(-50%);font-size:26px'>🔻</div></div>" +
    "<div><h2 style='margin:0 0 10px'>🎁 Roleta diária</h2><div id='rr' style='font-size:18px;min-height:50px'>" +
    (pode ? "<button style='font-size:20px;padding:10px 24px' onclick='girar()'>GIRAR</button>" : "Você já girou hoje.<br>Volte amanhã!") +
    "</div><br><button style='font-size:16px;padding:8px 16px' onclick='fecharRoleta()'>Voltar</button></div>";
  rol.style.display = "flex";
}

function girar() {
  const hoje = new Date().toDateString();
  if (save.dia === hoje) return;
  save.dia = hoje;
  const i = sorteio();
  const res = PR[i].f();
  gravar();
  document.getElementById("rd").style.transform = "rotate(" + (360 * 5 - (i * 45 + 22.5)) + "deg)";
  setTimeout(() => {
    document.getElementById("rr").innerHTML = "Você ganhou:<br><b style='font-size:24px'>" + (res || PR[i].n) + "</b>";
  }, 4200);
}

var treino = false, tacadas = 0, pontos = 0, MAXT = 8;

function novoJogo() {
  novoJogo0();
  if (treino) montarTreino();
}

function montarTreino() {
  tacadas = 0; pontos = 0; caiu = []; falta = false;
  bolas.length = 1;
  for (let i = 1; i <= 5; i++) {
    for (let t = 0; t < 300; t++) {
      const x = 260 + Math.random() * (W - 300);
      const y = 40 + Math.random() * (H - 80);
      const livre = bolas.every(b => Math.hypot(b.x - x, b.y - y) > R * 3) &&
        cacapas.every(k => Math.hypot(k.x - x, k.y - y) > RC + 25);
      if (livre || t === 299) {
        bolas.push({ x: x, y: y, vx: 0, vy: 0, cor: cores[i - 1], num: i, listrada: false });
        break;
      }
    }
  }
}

function fimDaJogada() {
  if (!treino) { fimDaJogada0(); return; }
  jogando = false; vez = 1;
  tacadas++; pontos += caiu.length;
  if (bolas.length === 1 || tacadas >= MAXT) {
    const limpou = bolas.length === 1;
    const g = pontos * 10 + (limpou ? 30 : 0);
    save.moedas += g;
    const novo = pontos > (save.rec || 0);
    if (novo) save.rec = pontos;
    ganharXP(pontos * 6);
    fim = true;
    msg = pontos + "/5 bolas! +" + g + " 🪙" + (novo ? " 🏅" : "");
  }
}

function irTreino() {
  sairOnline(); torneioAtivo = false;
  treino = true; novoJogo(); fechar();
}

function loop() {






  botLoop();
  atualizarMira();
  torneioLoop();
  premio();
  premioXP();
  if (online !== 2) for (let i = 0; i < SUB; i++) passo();
  netLoop();
  desenhar();
  requestAnimationFrame(loop);
}
loop();
abrirMenu();
</script>
